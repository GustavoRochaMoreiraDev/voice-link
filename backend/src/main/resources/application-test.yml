spring:
  datasource:
    url: jdbc:h2:mem:voicelink_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: VoiceLinkTestSecretKeyForTestingPurposesMustBeAtLeast256BitsLongHmacSha256
    expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.voicelink: DEBUG
