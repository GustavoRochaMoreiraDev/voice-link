# Coturn TURN Server Configuration for VoiceLink
listening-port=3478
tls-listening-port=5349

# Realm definition
realm=voicelink.local
server-name=voicelink-coturn

# Static authentication credentials for development/testing
lt-cred-mech
user=voicelink:voicelinksecret

# UDP relay ports range
min-port=49152
max-port=49160

# Security settings
no-cli
no-tls
no-dtls
fingerprint
verbose
log-file=stdout
